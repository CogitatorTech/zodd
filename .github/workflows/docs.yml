name: Publish Docs and Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make

      - name: Generate Documentation
        run: make docs

      - name: Build WASM Playground
        run: zig build wasm

      - name: Assemble Site
        run: |
          mkdir -p site/api
          cp web/index.html web/main.js web/style.css web/logo.svg site/
          cp zig-out/web/zodd.wasm site/
          cp -r docs/api/* site/api/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          user_name: ${{ github.actor }}
          user_email: ${{ github.actor }}@users.noreply.github.com
          commit_message: "docs: Deploy website from ${{ github.sha }} by ${{ github.actor }}"
