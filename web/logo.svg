<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 32 32">
    <title>Zodd</title>
    <!--
      A directed graph whose base edges trace a Z, plus a dashed arc for the
      derived fact: path(a, d) follows from edge(a, b), edge(b, c), edge(c, d).
    -->
    <defs>
        <marker id="arrow" viewBox="0 0 6 6" refX="6" refY="3"
                markerUnits="userSpaceOnUse" markerWidth="4" markerHeight="4"
                orient="auto-start-reverse">
            <path d="M 0,0 L 6,3 L 0,6 z" fill="#f7a41d"/>
        </marker>
    </defs>
    <circle cx="16" cy="16" r="15" fill="#ffffff" stroke="#f7a41d" stroke-width="1.6"/>
    <g transform="translate(16 16) scale(0.85) translate(-14.85 -12.85)">
        <!-- derived fact: a -> d -->
        <path d="M 8.4,4.9 C 14.5,1.2 25.4,2.4 25.4,11 C 25.4,14.2 24.4,16.7 22.9,18.5"
              fill="none" stroke="#f7a41d" stroke-width="1.4"
              stroke-dasharray="2.4 2" stroke-linecap="round"
              marker-end="url(#arrow)" opacity="0.8"/>
        <!-- base facts: a -> b, b -> c, c -> d -->
        <g fill="none" stroke="#f7a41d" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)">
            <path d="M 9.2,7 H 17.3"/>
            <path d="M 17.74,9.26 L 8.26,18.74"/>
            <path d="M 9.2,21 H 17.3"/>
        </g>
        <!-- nodes a, b, c, and d -->
        <g fill="#f7a41d">
            <circle cx="6" cy="7" r="2.4"/>
            <circle cx="20" cy="7" r="2.4"/>
            <circle cx="6" cy="21" r="2.4"/>
            <circle cx="20" cy="21" r="2.4"/>
        </g>
    </g>
</svg>
